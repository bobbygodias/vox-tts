[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vox-tts"
version = "0.2.0.dev0"
description = "Backend-neutral Brazilian Portuguese text-to-speech core"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Bobby Dias" },
  { name = "Andrew Vox" },
]
dependencies = []

[project.scripts]
vox = "vox_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
